version: 1

applications:
  - appRoot: apps/main

    frontend:
      buildPath: "/"

      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install --frozen-lockfile

        build:
          commands:
            - pnpm turbo build --filter=main

      artifacts:
        baseDirectory: apps/main/.next
        files:
          - "**/*"

      cache:
        paths:
          - node_modules/**/*
          - .turbo/**/*

  - appRoot: apps/portfolio

    frontend:
      buildPath: "/"

      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install --frozen-lockfile

        build:
          commands:
            - pnpm turbo build --filter=portfolio

      artifacts:
        baseDirectory: apps/portfolio/.next
        files:
          - "**/*"

      cache:
        paths:
          - node_modules/**/*
          - .turbo/**/*
