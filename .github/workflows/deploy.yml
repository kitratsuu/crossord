name: Deploy to VPS

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set deployment variables based on branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy_path=/var/www/crossord-main" >> "$GITHUB_OUTPUT"
            echo "pm2_name=crossord-main" >> "$GITHUB_OUTPUT"
            echo "port=3000" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "deploy_path=/var/www/crossord-dev" >> "$GITHUB_OUTPUT"
            echo "pm2_name=crossord-dev" >> "$GITHUB_OUTPUT"
            echo "port=3001" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ steps.vars.outputs.deploy_path }}
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Monorepo: install + build from repo root so shared packages build too
            pnpm install --frozen-lockfile
            pnpm build

            # The actual Next.js app lives in apps/main, so start must run from there
            cd apps/main
            pm2 restart ${{ steps.vars.outputs.pm2_name }} || \
              pm2 start pnpm --name "${{ steps.vars.outputs.pm2_name }}" -- start -p ${{ steps.vars.outputs.port }}

            pm2 save
